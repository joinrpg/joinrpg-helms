{{- /*
Публичный адрес интерфейса Coroot через общий Gateway (traefik). Доступ открыт всем,
защита — пароль пользователей Coroot. TLS терминирует listener Gateway с тем же hostname,
сертификат для него cert-manager выпускает по аннотации Gateway.
*/ -}}
{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coroot
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coroot-coroot
          port: 8080
{{- end }}
